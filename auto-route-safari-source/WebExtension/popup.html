<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Auto Route</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <header class="topbar">
      <div>
        <h1>Auto Route</h1>
        <p id="platformLabel">Selective proxy routing</p>
      </div>
      <label class="switch" aria-label="Enable Auto Route">
        <input id="enabledToggle" type="checkbox">
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </label>
    </header>

    <section class="route-summary" aria-live="polite">
      <div class="domain-block">
        <span class="summary-label">Current domain</span>
        <strong id="currentDomain">No web page</strong>
      </div>
      <div class="route-block">
        <span class="summary-label">Route</span>
        <strong id="currentRoute" class="route-value direct"><span></span>DIRECT</strong>
      </div>
    </section>

    <p id="connectionStatus" class="connection-status">Checking routing status…</p>

    <section class="route-actions" aria-label="Route this domain">
      <button class="route-button" data-route="auto" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 8.5 12M12 7v5l3 2M18 3v5h-5"/></svg>
        Automatic
      </button>
      <button class="route-button direct" data-route="direct" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M15 7l5 5-5 5M9 7l-5 5 5 5"/></svg>
        Direct
      </button>
      <button class="route-button proxy" data-route="proxy" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.6-2.8 7.8-7 10-4.2-2.2-7-5.4-7-10V6l7-3z"/></svg>
        Proxy
      </button>
    </section>

    <button id="retryButton" class="retry-button" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5M6.1 8a7 7 0 0 1 11.4-1.8L20 9M4 15l2.5 2.8A7 7 0 0 0 18 16"/></svg>
      Retry through proxy
    </button>

    <div id="feedback" class="feedback" hidden></div>

    <button id="openSettings" class="settings-button" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z"/></svg>
      Settings
    </button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
